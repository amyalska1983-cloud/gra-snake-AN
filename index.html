<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syk dżungli</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #06120a url("tlo-dzungla/tlo-dzungla-ai.jpg") center / cover no-repeat fixed;
      color: #e8f5d8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 64px);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #f4ffb0 0%, #c8e64a 45%, #e0a92a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 #1a3a10) drop-shadow(0 10px 18px rgba(0, 0, 0, 0.7));
    }
    #score {
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(4, 18, 8, 0.72);
      border: 1px solid rgba(160, 220, 120, 0.25);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    .stage {
      perspective: 1000px;
    }
    canvas {
      display: block;
      max-width: calc(100vw - 32px);
      height: auto;
      border-radius: 10px;
      /* pochylenie planszy daje głębię; drewniana rama i cień „unoszą" ją nad tłem */
      transform: rotateX(16deg);
      transform-origin: 50% 60%;
      box-shadow:
        0 0 0 6px #2a1d10,
        0 0 0 9px #4a3620,
        0 0 0 10px #1a1209,
        0 34px 60px rgba(0, 0, 0, 0.65);
    }
    .layout {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }
    .panel {
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(4, 18, 8, 0.72);
      border: 1px solid rgba(160, 220, 120, 0.25);
    }
    #player form, #whoami { display: flex; gap: 8px; align-items: center; }
    /* display:flex powyżej nadpisałby atrybut hidden — bez tego widać wszystkie trzy widoki naraz */
    #player [hidden] { display: none; }
    #player { max-width: calc(100vw - 32px); box-sizing: border-box; }
    #player form { flex-wrap: wrap; justify-content: center; }
    #player input {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(160, 220, 120, 0.35);
      background: rgba(0, 0, 0, 0.35);
      color: inherit;
      font: inherit;
    }
    #player button {
      padding: 6px 12px;
      border: 0;
      border-radius: 8px;
      background: #8bc34a;
      color: #0b1d08;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #msg { min-height: 1.2em; margin-top: 6px; font-size: 14px; color: #f2d64a; }
    #msg:empty { display: none; }
    #leaderboard { width: 210px; }
    #leaderboard h2 { margin: 0 0 8px; font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase; }
    #leaders { margin: 0; padding-left: 22px; font-variant-numeric: tabular-nums; }
    #leaders li { display: list-item; margin: 3px 0; }
    #leaders .pts { float: right; font-weight: 600; }

    /* Animacje tła: warstwa nad zdjęciem, pod grą. Tylko transform i opacity — nie obciążają pętli gry. */
    body > :not(.ambient) { position: relative; z-index: 1; }
    .ambient {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .rays {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 35% 30% at 82% 20%, rgba(255, 196, 90, 0.35), transparent 70%),
        linear-gradient(118deg, transparent 52%, rgba(255, 220, 140, 0.10) 56%, transparent 60%),
        linear-gradient(124deg, transparent 60%, rgba(255, 220, 140, 0.08) 63%, transparent 67%);
      mix-blend-mode: screen;
      animation: rays 8s ease-in-out infinite alternate;
    }
    @keyframes rays {
      from { opacity: 0.35; }
      to { opacity: 1; }
    }
    /* Kafel mgły ma 50vw szerokości, a warstwa przesuwa się dokładnie o jeden kafel — pętla bez szwu. */
    /* --mist: 0–1 z suwaka; 0.5 odpowiada pierwotnej gęstości mgły. */
    .ambient { --mist: 0.5; }
    .mist {
      position: absolute;
      left: 0;
      width: 200vw;
      height: 34vh;
      bottom: -6vh;
      background: radial-gradient(ellipse at center, rgba(205, 230, 215, 0.32), transparent 65%) 0 0 / 50vw 100% repeat-x;
      opacity: var(--mist);
      animation: mist 70s linear infinite;
    }
    .mist.far {
      bottom: 6vh;
      height: 24vh;
      opacity: calc(var(--mist) * 0.6);
      animation-duration: 110s;
      animation-direction: reverse;
    }
    @keyframes mist {
      from { transform: translateX(0); }
      to { transform: translateX(-50vw); }
    }
    .firefly {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #f4ff9e;
      box-shadow: 0 0 8px 3px rgba(214, 255, 106, 0.7);
      animation:
        drift var(--d) ease-in-out var(--delay) infinite alternate,
        glow var(--g) ease-in-out var(--delay) infinite alternate;
    }
    @keyframes drift {
      to { transform: translate(var(--dx), var(--dy)); }
    }
    @keyframes glow {
      from { opacity: 0.1; }
      to { opacity: 1; }
    }
    .butterfly {
      position: absolute;
      left: 0;
      width: 34px;
      height: 26px;
      animation: fly var(--t) linear var(--delay) infinite;
    }
    .butterfly svg { width: 100%; height: 100%; animation: bob 1.6s ease-in-out infinite alternate; }
    .butterfly .wing { transform-box: fill-box; animation: flap 0.22s ease-in-out infinite alternate; }
    .butterfly .wing.l { transform-origin: right center; }
    .butterfly .wing.r { transform-origin: left center; }
    .butterfly.back { animation-direction: reverse; }
    .butterfly.back svg { transform: scaleX(-1); }
    @keyframes fly {
      from { transform: translateX(-60px); }
      to { transform: translateX(calc(100vw + 60px)); }
    }
    @keyframes bob {
      from { translate: 0 -14px; }
      to { translate: 0 14px; }
    }
    @keyframes flap {
      from { transform: scaleX(1); }
      to { transform: scaleX(0.25); }
    }
    #fog-control {
      position: fixed;
      left: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      font-size: 14px;
    }
    #fog-control input { width: 140px; accent-color: #8bc34a; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) {
      .ambient * { animation: none !important; }
      .butterfly { display: none; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="rays"></div>
    <div class="mist far"></div>
    <div class="mist"></div>
    <div class="butterfly" style="top: 18vh; --t: 26s; --delay: 2s"></div>
    <div class="butterfly back" style="top: 64vh; --t: 34s; --delay: 14s"></div>
  </div>
  <h1>Syk dżungli</h1>
  <div id="score">Punkty: 0</div>
  <div id="player" class="panel">
    <form id="login-form" hidden>
      <input id="email" type="email" required placeholder="Twój e-mail" autocomplete="email">
      <button type="submit">Wyślij link logowania</button>
    </form>
    <form id="nick-form" hidden>
      <input id="nick" type="text" required minlength="3" maxlength="20" placeholder="Wybierz nick">
      <button type="submit">Zapisz nick</button>
    </form>
    <div id="whoami" hidden>Grasz jako <strong id="nick-label"></strong> <button id="logout" type="button">Wyloguj</button></div>
    <div id="msg" role="status"></div>
  </div>
  <div class="layout">
    <div class="stage">
      <canvas id="board" width="480" height="480"></canvas>
    </div>
    <aside id="leaderboard" class="panel">
      <h2>Najlepsi</h2>
      <ol id="leaders"></ol>
    </aside>
  </div>
  <label id="fog-control" class="panel">Mgła
    <input id="fog" type="range" min="0" max="1" step="0.05" value="0.5">
  </label>

  <script>
    // Świetliki i motyle tła. Losowe pozycje omijają środek ekranu, gdzie stoi plansza.
    (function () {
      'use strict';

      var ambient = document.querySelector('.ambient');
      var FIREFLIES = 28;

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      for (var i = 0; i < FIREFLIES; i++) {
        var x = rand(0, 100);
        var y = rand(0, 100);
        if (x > 28 && x < 72 && y < 78) x = x < 50 ? rand(0, 28) : rand(72, 100);
        var f = document.createElement('span');
        f.className = 'firefly';
        f.style.left = x.toFixed(1) + 'vw';
        f.style.top = y.toFixed(1) + 'vh';
        f.style.setProperty('--dx', rand(-60, 60).toFixed(0) + 'px');
        f.style.setProperty('--dy', rand(-50, 50).toFixed(0) + 'px');
        f.style.setProperty('--d', rand(6, 14).toFixed(1) + 's');
        f.style.setProperty('--g', rand(1.2, 3.5).toFixed(1) + 's');
        f.style.setProperty('--delay', (-rand(0, 10)).toFixed(1) + 's');
        ambient.appendChild(f);
      }

      var BUTTERFLY =
        '<svg viewBox="-28 -22 56 44">' +
          '<defs><radialGradient id="mwing" cx="30%" cy="50%" r="80%">' +
            '<stop offset="0" stop-color="#7fd8ff"/><stop offset="0.6" stop-color="#1a7fe0"/>' +
            '<stop offset="1" stop-color="#06204f"/></radialGradient></defs>' +
          '<g class="wing l"><path d="M-1 -2 C-10 -20 -26 -24 -26 -12 C-26 -2 -14 2 -1 1 Z M-1 2 C-16 4 -20 16 -12 18 C-6 19 -2 10 -1 4 Z" fill="url(#mwing)" stroke="#050a18" stroke-width="1.2"/></g>' +
          '<g class="wing r"><path d="M1 -2 C10 -20 26 -24 26 -12 C26 -2 14 2 1 1 Z M1 2 C16 4 20 16 12 18 C6 19 2 10 1 4 Z" fill="url(#mwing)" stroke="#050a18" stroke-width="1.2"/></g>' +
          '<ellipse cx="0" cy="0" rx="1.6" ry="9" fill="#1a1410"/>' +
        '</svg>';
      var butterflies = document.querySelectorAll('.butterfly');
      for (var k = 0; k < butterflies.length; k++) butterflies[k].innerHTML = BUTTERFLY;

      var FOG_KEY = 'syk-dzungli.mgla';
      var fog = document.getElementById('fog');
      try {
        var saved = localStorage.getItem(FOG_KEY);
        if (saved !== null) fog.value = saved;
      } catch (e) { /* tryb prywatny — zostaje wartość domyślna */ }
      function applyFog() {
        ambient.style.setProperty('--mist', fog.value);
      }
      applyFog();
      fog.addEventListener('input', applyFog);
      fog.addEventListener('change', function () {
        try { localStorage.setItem(FOG_KEY, fog.value); } catch (e) { /* bez zapamiętania */ }
        // Fokus na suwaku przechwytywałby strzałki, które mają sterować wężem.
        fog.blur();
      });
    })();
  </script>
  <script src="snake-logic.js"></script>
  <script src="snake-cloud.js"></script>
  <script>
    (function () {
      'use strict';

      var L = window.SnakeLogic;
      var CELL = 24;
      var MAX_STEPS_PER_FRAME = 5;
      var COLORS = {
        tileA: '#1f4a1c',
        tileB: '#1a4118',
        shadow: 'rgba(0, 18, 4, 0.45)',
        text: '#e8f5d8'
      };

      var KEY_TO_DIR = {
        arrowup: 'up', w: 'up',
        arrowdown: 'down', s: 'down',
        arrowleft: 'left', a: 'left',
        arrowright: 'right', d: 'right'
      };

      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var scoreEl = document.getElementById('score');
      var C = window.SnakeCloud;
      var loginForm = document.getElementById('login-form');
      var nickForm = document.getElementById('nick-form');
      var whoami = document.getElementById('whoami');
      var emailInput = document.getElementById('email');
      var loginButton = loginForm.querySelector('button');
      var nickInput = document.getElementById('nick');
      var nickLabel = document.getElementById('nick-label');
      var msgEl = document.getElementById('msg');
      var leadersEl = document.getElementById('leaders');

      var player = null;       // { nick } gdy zalogowany i z nickiem — tylko wtedy zapisujemy
      var resumeOffer = null;  // { state, playMs } — zapis czekający na decyzję gracza
      var lastSaveAt = 0;
      var AUTOSAVE_MS = 5000;

      // Zapisy idą po kolei: autozapis wysłany tuż przed końcem gry nie może
      // dotrzeć po skasowaniu zapisu i „wskrzesić" zakończonej gry.
      var writes = Promise.resolve();
      function queueWrite(fn) {
        writes = writes.then(fn).catch(function () {});
        return writes;
      }

      function canSave() {
        return !!player && (state.status === 'running' || state.status === 'paused');
      }

      function saveNow(keepalive) {
        if (!canSave()) return;
        lastSaveAt = performance.now();
        // Kopia teraz, bo stan zmieni się, zanim zapis wyjdzie z kolejki.
        var payload = JSON.parse(JSON.stringify({ state: state, playMs: playMs }));
        queueWrite(function () {
          return C.saveGame(payload, keepalive).then(function (r) {
            if (r.ok) return;
            if (sessionLost(r)) onSessionLost();
            else say(errorText(r));
          });
        });
      }

      function discardSave() {
        queueWrite(function () {
          return C.deleteGame().then(function (r) {
            if (sessionLost(r)) onSessionLost();
          });
        });
      }

      function submitScore(score, result, ms, retried) {
        queueWrite(function () {
          return C.submitScore(score, result, ms).then(function (r) {
            if (r.ok) {
              say('Wynik zapisany');
              refreshLeaderboard();
            } else if (sessionLost(r)) {
              onSessionLost();
            } else if (!retried) {
              setTimeout(function () { submitScore(score, result, ms, true); }, 3000);
            } else {
              say(r.error === 'network' ? 'Brak połączenia — wynik nie zapisany' : errorText(r));
            }
          });
        });
      }

      function onGameEnd() {
        if (!player) return;
        submitScore(state.score, state.status, playMs, false);
        discardSave();
      }

      var ERRORS = {
        network: 'Brak połączenia — zapis niedostępny',
        nick_taken: 'Ten nick jest zajęty',
        over_email_send_rate_limit: 'Limit wysyłki linków — spróbuj za godzinę',
        session_expired: 'Sesja wygasła — zaloguj się ponownie',
        otp_expired: 'Link logowania wygasł — wyślij nowy',
        not_signed_in: 'Nie jesteś zalogowany',
        // 23514 = naruszenie ograniczenia CHECK w Postgresie (długość nicku).
        '23514': 'Nick musi mieć 3–20 znaków'
      };

      // not_signed_in przy ustawionym graczu znaczy, że sesję zabrał wcześniejszy nieudany refresh
      // albo wylogowanie w innej karcie.
      function sessionLost(r) {
        return r.error === 'session_expired' || (r.error === 'not_signed_in' && !!player);
      }

      function onSessionLost() {
        player = null;
        resumeOffer = null;
        setView('login');
        say(ERRORS.session_expired);
      }

      function errorText(r) {
        if (r.status === 429) return ERRORS.over_email_send_rate_limit;
        return ERRORS[r.error] || 'Błąd: ' + r.error;
      }

      function say(text) {
        msgEl.textContent = text || '';
      }

      // name: 'login' | 'nick' | 'player' | null (nic poza komunikatem)
      function setView(name) {
        loginForm.hidden = name !== 'login';
        nickForm.hidden = name !== 'nick';
        whoami.hidden = name !== 'player';
      }

      // Po kliknięciu przycisku fokus zostaje na nim, a Enter/Spacja kliknęłyby go ponownie zamiast sterować grą.
      function releaseFocus() {
        if (document.activeElement) document.activeElement.blur();
      }

      function refreshPlayer() {
        if (!C.isSignedIn()) {
          player = null;
          setView('login');
          return;
        }
        C.getPlayer().then(function (r) {
          if (!r.ok) {
            if (sessionLost(r)) {
              onSessionLost();
              return;
            }
            if (!C.isSignedIn()) player = null;
            setView(C.isSignedIn() ? null : 'login');
            say(errorText(r));
            return;
          }
          if (!r.data) {
            player = null;
            setView('nick');
            return;
          }
          player = r.data;
          nickLabel.textContent = player.nick;
          setView('player');
          onPlayerReady();
        });
      }

      function onPlayerReady() {
        C.loadGame().then(function (r) {
          if (sessionLost(r)) {
            onSessionLost();
            return;
          }
          // Wylogowanie w trakcie wczytywania — oferta wznowienia nie ma już sensu.
          if (!player || !r.ok || !r.data) return;
          var payload = r.data.state;
          var restored = payload && L.restoreState(payload.state);
          if (!restored) {
            discardSave();
            say('Zapis uszkodzony — zaczynasz od nowa');
            return;
          }
          // Gra zaczęta, zanim zapis zdążył się wczytać, ma pierwszeństwo.
          if (state.status !== 'ready') return;
          resumeOffer = { state: restored, playMs: Number(payload.playMs) || 0 };
        });
      }

      function refreshLeaderboard() {
        C.getLeaderboard().then(function (r) {
          leadersEl.textContent = '';
          if (!r.ok || !r.data.length) {
            var empty = document.createElement('li');
            empty.textContent = r.ok ? 'Jeszcze nikt nie grał' : 'Brak połączenia';
            leadersEl.appendChild(empty);
            return;
          }
          r.data.forEach(function (row) {
            var li = document.createElement('li');
            var pts = document.createElement('span');
            pts.className = 'pts';
            pts.textContent = row.score;
            li.appendChild(pts);
            li.appendChild(document.createTextNode(row.nick));
            leadersEl.appendChild(li);
          });
        });
      }

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        releaseFocus();
        var email = emailInput.value.trim();
        say('Wysyłam link…');
        loginButton.disabled = true;
        C.sendMagicLink(email).then(function (r) {
          loginButton.disabled = false;
          say(r.ok ? 'Sprawdź skrzynkę ' + email + ' i kliknij link logowania' : errorText(r));
        });
      });

      nickForm.addEventListener('submit', function (e) {
        e.preventDefault();
        releaseFocus();
        C.createPlayer(nickInput.value.trim()).then(function (r) {
          if (sessionLost(r)) {
            onSessionLost();
            return;
          }
          if (!r.ok) {
            say(errorText(r));
            return;
          }
          say('');
          refreshPlayer();
        });
      });

      document.getElementById('logout').addEventListener('click', function () {
        releaseFocus();
        C.signOut().then(function () {
          player = null;
          resumeOffer = null;
          setView('login');
          say('Wylogowano');
        });
      });

      var boot = C.init();
      if (boot.linkError) say(errorText({ error: boot.linkError }));
      refreshPlayer();
      refreshLeaderboard();

      var state = L.createState();
      var accumulator = 0;
      var lastTime = null;
      var playMs = 0;          // czas gry bez pauz — trafia do scores.duration_ms

      // Ostre rysowanie na ekranach o wysokiej gęstości pikseli.
      var W = state.cols * CELL;
      var H = state.rows * CELL;
      var dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      document.addEventListener('keydown', function (e) {
        // Pisanie w polach formularza nie może sterować wężem (np. „wsad" w nicku).
        var tag = e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        var key = e.key.toLowerCase();
        var dirName = KEY_TO_DIR[key];
        var isRestartKey = key === ' ' || key === 'enter';

        if (key.indexOf('arrow') === 0 || key === ' ') e.preventDefault();

        // Dopóki gracz nie wybierze „wznów" albo „nowa gra", inne klawisze nic nie robią.
        if (resumeOffer && state.status === 'ready') {
          if (key === 'enter') {
            state = resumeOffer.state;
            playMs = resumeOffer.playMs;
            resumeOffer = null;
            accumulator = 0;
          } else if (key === 'n') {
            resumeOffer = null;
            discardSave();
          }
          return;
        }

        if (key === 'p' || key === 'escape') {
          // Przytrzymany klawisz przełączałby pauzę w kółko i za każdym razem zapisywał.
          if (e.repeat) return;
          togglePause();
        } else if (dirName) {
          if (state.status === 'ready') {
            L.start(state);
            accumulator = 0;
          }
          if (state.status === 'paused') {
            L.resume(state);
            accumulator = 0;
          }
          if (state.status === 'running') L.enqueueDirection(state, L.DIRECTIONS[dirName]);
        } else if (isRestartKey && (state.status === 'over' || state.status === 'won')) {
          state = L.createState();
          accumulator = 0;
          playMs = 0;
        }
      });

      function togglePause() {
        if (state.status === 'running') {
          L.pause(state);
          saveNow(false);
        } else if (state.status === 'paused') {
          L.resume(state);
          accumulator = 0;
        }
      }

      document.addEventListener('visibilitychange', function () {
        if (document.hidden && state.status === 'running') {
          L.pause(state);
          saveNow(true);
        }
      });

      function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }

      // Plansza się nie zmienia — rysujemy ją raz do bufora.
      var boardImg = (function () {
        var b = document.createElement('canvas');
        b.width = W * dpr;
        b.height = H * dpr;
        var c = b.getContext('2d');
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        for (var y = 0; y < state.rows; y++) {
          for (var x = 0; x < state.cols; x++) {
            var px = x * CELL, py = y * CELL;
            c.fillStyle = (x + y) % 2 ? COLORS.tileA : COLORS.tileB;
            c.fillRect(px, py, CELL, CELL);
            // faza kafelka: jasna krawędź od światła, ciemna po przeciwnej stronie
            c.fillStyle = 'rgba(255, 255, 220, 0.07)';
            c.fillRect(px, py, CELL, 2);
            c.fillRect(px, py, 2, CELL);
            c.fillStyle = 'rgba(0, 0, 0, 0.22)';
            c.fillRect(px, py + CELL - 2, CELL, 2);
            c.fillRect(px + CELL - 2, py, 2, CELL);
          }
        }
        var v = c.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.75);
        v.addColorStop(0, 'rgba(0, 0, 0, 0)');
        v.addColorStop(1, 'rgba(0, 12, 2, 0.55)');
        c.fillStyle = v;
        c.fillRect(0, 0, W, H);
        return b;
      })();

      // Łuski: ciało faluje między zielenią liścia a złotawą oliwką.
      // Odcienie 66–96 trzymają się z dala od czerwieni jedzenia.
      function bodyHue(index) {
        return 81 + 15 * Math.cos(index * 0.5);
      }

      function segmentFill(x, y, hue, light) {
        var g = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
        g.addColorStop(0, 'hsl(' + hue.toFixed(1) + ', 70%, ' + (light + 18) + '%)');
        g.addColorStop(0.5, 'hsl(' + hue.toFixed(1) + ', 72%, ' + light + '%)');
        g.addColorStop(1, 'hsl(' + hue.toFixed(1) + ', 78%, ' + (light - 16) + '%)');
        return g;
      }

      // Mostek między sąsiednimi segmentami — wąż wygląda jak jedna bryła.
      // Pomijany przy zawinięciu przez krawędź, bo segmenty są wtedy daleko od siebie.
      function bridge(a, b, fill, offset) {
        if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) !== 1) return;
        var x = Math.min(a.x, b.x) * CELL + 4 + offset;
        var y = Math.min(a.y, b.y) * CELL + 4 + offset;
        var w = a.x === b.x ? CELL - 8 : CELL * 2 - 8;
        var h = a.y === b.y ? CELL - 8 : CELL * 2 - 8;
        ctx.fillStyle = fill;
        roundRect(ctx, x, y, w, h, 6);
        ctx.fill();
      }

      function drawSnake() {
        var s = state.snake;
        var i;

        // 1. cienie całego węża, przesunięte w dół-prawo
        for (i = 0; i < s.length; i++) {
          ctx.fillStyle = COLORS.shadow;
          roundRect(ctx, s[i].x * CELL + 4, s[i].y * CELL + 5, CELL - 4, CELL - 4, 8);
          ctx.fill();
          if (i > 0) bridge(s[i - 1], s[i], COLORS.shadow, 3);
        }

        // 2. ciało od ogona do szyi
        for (i = s.length - 1; i >= 1; i--) {
          var hue = bodyHue(i);
          var x = s[i].x * CELL, y = s[i].y * CELL;
          bridge(s[i - 1], s[i], 'hsl(' + hue.toFixed(1) + ', 72%, 46%)', 0);
          ctx.fillStyle = segmentFill(x, y, hue, 50);
          roundRect(ctx, x + 2, y + 2, CELL - 4, CELL - 4, 8);
          ctx.fill();
          // odblask
          ctx.fillStyle = 'rgba(255, 255, 230, 0.35)';
          ctx.beginPath();
          ctx.ellipse(x + 9, y + 8, 5, 3, -0.6, 0, Math.PI * 2);
          ctx.fill();
        }

        drawHead(s[0]);
      }

      function drawHead(cell) {
        var x = cell.x * CELL, y = cell.y * CELL;
        ctx.fillStyle = segmentFill(x, y, 60, 56);
        roundRect(ctx, x + 1, y + 1, CELL - 2, CELL - 2, 9);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 230, 0.4)';
        ctx.beginPath();
        ctx.ellipse(x + 8, y + 7, 5, 3, -0.6, 0, Math.PI * 2);
        ctx.fill();

        // oczy patrzą w kierunku ruchu
        var d = state.direction;
        var px = -d.y, py = d.x;
        var cx = x + CELL / 2 + d.x * 4, cy = y + CELL / 2 + d.y * 4;
        for (var k = -1; k <= 1; k += 2) {
          var ex = cx + px * 5 * k, ey = cy + py * 5 * k;
          ctx.fillStyle = '#f7f3d8';
          ctx.beginPath();
          ctx.arc(ex, ey, 3.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0d1a08';
          ctx.beginPath();
          ctx.arc(ex + d.x * 1.3, ey + d.y * 1.3, 1.9, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(ex + d.x * 1.3 - 0.7, ey + d.y * 1.3 - 0.7, 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawFood(now) {
        if (!state.food) return;
        var cx = state.food.x * CELL + CELL / 2;
        var cy = state.food.y * CELL + CELL / 2;
        var pulse = 1 + 0.06 * Math.sin(now / 250);
        var r = (CELL / 2 - 1.5) * pulse;

        ctx.fillStyle = 'rgba(0, 18, 4, 0.45)';
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy + r - 1, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();

        var g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
        g.addColorStop(0, '#ff9a7a');
        g.addColorStop(0.45, '#ef4444');
        g.addColorStop(1, '#8f1414');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        ctx.ellipse(cx - r * 0.38, cy - r * 0.42, r * 0.28, r * 0.16, -0.6, 0, Math.PI * 2);
        ctx.fill();

        // listek
        ctx.fillStyle = '#5fbf3a';
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy - r - 1, 5, 2.4, -0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawOverlay(lines) {
        ctx.fillStyle = 'rgba(6, 24, 10, 0.72)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 8;
        var mid = H / 2 - (lines.length - 1) * 18;
        for (var i = 0; i < lines.length; i++) {
          ctx.font = i === 0 ? '600 26px system-ui, sans-serif' : '18px system-ui, sans-serif';
          ctx.fillText(lines[i], W / 2, mid + i * 36);
        }
        ctx.shadowBlur = 0;
      }

      function render(now) {
        ctx.drawImage(boardImg, 0, 0, W, H);
        drawFood(now);
        drawSnake();

        scoreEl.textContent = 'Punkty: ' + state.score;

        if (state.status === 'ready') {
          drawOverlay(resumeOffer
            ? ['Wznów grę (' + resumeOffer.state.score + ' pkt) — Enter', 'Nowa gra — N']
            : ['Strzałki lub WSAD — start']);
        } else if (state.status === 'paused') {
          drawOverlay(['Pauza', 'P lub strzałka — wznów']);
        } else if (state.status === 'over') {
          drawOverlay(player
            ? ['Koniec gry · Punkty: ' + state.score, 'Spacja — nowa gra']
            : ['Koniec gry · Punkty: ' + state.score, 'Spacja — nowa gra', 'Zaloguj się, aby zapisać wynik']);
        } else if (state.status === 'won') {
          drawOverlay(['Wygrana! Plansza zapełniona', 'Spacja — nowa gra']);
        }
      }

      function frame(now) {
        if (lastTime === null) lastTime = now;
        var dt = now - lastTime;
        lastTime = now;

        if (state.status === 'running') {
          playMs += Math.min(dt, 1000);
          // Górny limit akumulatora chroni przed lawiną kroków po powrocie z nieaktywnej karty.
          accumulator = Math.min(accumulator + dt, state.intervalMs * MAX_STEPS_PER_FRAME);
          var steps = 0;
          while (accumulator >= state.intervalMs && state.status === 'running' && steps < MAX_STEPS_PER_FRAME) {
            accumulator -= state.intervalMs;
            L.step(state);
            steps++;
          }
          if (state.status === 'over' || state.status === 'won') {
            onGameEnd();
          } else if (now - lastSaveAt >= AUTOSAVE_MS) {
            saveNow(false);
          }
        } else {
          accumulator = 0;
        }

        render(now);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
