<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #06120a url("tlo-dzungla/tlo-dzungla.jpg") center / cover no-repeat fixed;
      color: #e8f5d8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    #score {
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(4, 18, 8, 0.72);
      border: 1px solid rgba(160, 220, 120, 0.25);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    .stage {
      perspective: 1000px;
    }
    canvas {
      display: block;
      max-width: calc(100vw - 32px);
      height: auto;
      border-radius: 10px;
      /* pochylenie planszy daje głębię; drewniana rama i cień „unoszą" ją nad tłem */
      transform: rotateX(16deg);
      transform-origin: 50% 60%;
      box-shadow:
        0 0 0 6px #2a1d10,
        0 0 0 9px #4a3620,
        0 0 0 10px #1a1209,
        0 34px 60px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>
<body>
  <div id="score">Punkty: 0</div>
  <div class="stage">
    <canvas id="board" width="480" height="480"></canvas>
  </div>

  <script src="snake-logic.js"></script>
  <script>
    (function () {
      'use strict';

      var L = window.SnakeLogic;
      var CELL = 24;
      var MAX_STEPS_PER_FRAME = 5;
      var COLORS = {
        tileA: '#1f4a1c',
        tileB: '#1a4118',
        shadow: 'rgba(0, 18, 4, 0.45)',
        text: '#e8f5d8'
      };

      var KEY_TO_DIR = {
        arrowup: 'up', w: 'up',
        arrowdown: 'down', s: 'down',
        arrowleft: 'left', a: 'left',
        arrowright: 'right', d: 'right'
      };

      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var scoreEl = document.getElementById('score');

      var state = L.createState();
      var accumulator = 0;
      var lastTime = null;

      // Ostre rysowanie na ekranach o wysokiej gęstości pikseli.
      var W = state.cols * CELL;
      var H = state.rows * CELL;
      var dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      document.addEventListener('keydown', function (e) {
        var key = e.key.toLowerCase();
        var dirName = KEY_TO_DIR[key];
        var isRestartKey = key === ' ' || key === 'enter';

        if (key.indexOf('arrow') === 0 || key === ' ') e.preventDefault();

        if (dirName) {
          if (state.status === 'ready') {
            L.start(state);
            accumulator = 0;
          }
          if (state.status === 'running') L.enqueueDirection(state, L.DIRECTIONS[dirName]);
        } else if (isRestartKey && (state.status === 'over' || state.status === 'won')) {
          state = L.createState();
          accumulator = 0;
        }
      });

      function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }

      // Plansza się nie zmienia — rysujemy ją raz do bufora.
      var boardImg = (function () {
        var b = document.createElement('canvas');
        b.width = W * dpr;
        b.height = H * dpr;
        var c = b.getContext('2d');
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        for (var y = 0; y < state.rows; y++) {
          for (var x = 0; x < state.cols; x++) {
            var px = x * CELL, py = y * CELL;
            c.fillStyle = (x + y) % 2 ? COLORS.tileA : COLORS.tileB;
            c.fillRect(px, py, CELL, CELL);
            // faza kafelka: jasna krawędź od światła, ciemna po przeciwnej stronie
            c.fillStyle = 'rgba(255, 255, 220, 0.07)';
            c.fillRect(px, py, CELL, 2);
            c.fillRect(px, py, 2, CELL);
            c.fillStyle = 'rgba(0, 0, 0, 0.22)';
            c.fillRect(px, py + CELL - 2, CELL, 2);
            c.fillRect(px + CELL - 2, py, 2, CELL);
          }
        }
        var v = c.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.75);
        v.addColorStop(0, 'rgba(0, 0, 0, 0)');
        v.addColorStop(1, 'rgba(0, 12, 2, 0.55)');
        c.fillStyle = v;
        c.fillRect(0, 0, W, H);
        return b;
      })();

      // Łuski: ciało faluje między zielenią liścia a złotawą oliwką.
      // Odcienie 66–96 trzymają się z dala od czerwieni jedzenia.
      function bodyHue(index) {
        return 81 + 15 * Math.cos(index * 0.5);
      }

      function segmentFill(x, y, hue, light) {
        var g = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
        g.addColorStop(0, 'hsl(' + hue.toFixed(1) + ', 70%, ' + (light + 18) + '%)');
        g.addColorStop(0.5, 'hsl(' + hue.toFixed(1) + ', 72%, ' + light + '%)');
        g.addColorStop(1, 'hsl(' + hue.toFixed(1) + ', 78%, ' + (light - 16) + '%)');
        return g;
      }

      // Mostek między sąsiednimi segmentami — wąż wygląda jak jedna bryła.
      // Pomijany przy zawinięciu przez krawędź, bo segmenty są wtedy daleko od siebie.
      function bridge(a, b, fill, offset) {
        if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) !== 1) return;
        var x = Math.min(a.x, b.x) * CELL + 4 + offset;
        var y = Math.min(a.y, b.y) * CELL + 4 + offset;
        var w = a.x === b.x ? CELL - 8 : CELL * 2 - 8;
        var h = a.y === b.y ? CELL - 8 : CELL * 2 - 8;
        ctx.fillStyle = fill;
        roundRect(ctx, x, y, w, h, 6);
        ctx.fill();
      }

      function drawSnake() {
        var s = state.snake;
        var i;

        // 1. cienie całego węża, przesunięte w dół-prawo
        for (i = 0; i < s.length; i++) {
          ctx.fillStyle = COLORS.shadow;
          roundRect(ctx, s[i].x * CELL + 4, s[i].y * CELL + 5, CELL - 4, CELL - 4, 8);
          ctx.fill();
          if (i > 0) bridge(s[i - 1], s[i], COLORS.shadow, 3);
        }

        // 2. ciało od ogona do szyi
        for (i = s.length - 1; i >= 1; i--) {
          var hue = bodyHue(i);
          var x = s[i].x * CELL, y = s[i].y * CELL;
          bridge(s[i - 1], s[i], 'hsl(' + hue.toFixed(1) + ', 72%, 46%)', 0);
          ctx.fillStyle = segmentFill(x, y, hue, 50);
          roundRect(ctx, x + 2, y + 2, CELL - 4, CELL - 4, 8);
          ctx.fill();
          // odblask
          ctx.fillStyle = 'rgba(255, 255, 230, 0.35)';
          ctx.beginPath();
          ctx.ellipse(x + 9, y + 8, 5, 3, -0.6, 0, Math.PI * 2);
          ctx.fill();
        }

        drawHead(s[0]);
      }

      function drawHead(cell) {
        var x = cell.x * CELL, y = cell.y * CELL;
        ctx.fillStyle = segmentFill(x, y, 60, 56);
        roundRect(ctx, x + 1, y + 1, CELL - 2, CELL - 2, 9);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 230, 0.4)';
        ctx.beginPath();
        ctx.ellipse(x + 8, y + 7, 5, 3, -0.6, 0, Math.PI * 2);
        ctx.fill();

        // oczy patrzą w kierunku ruchu
        var d = state.direction;
        var px = -d.y, py = d.x;
        var cx = x + CELL / 2 + d.x * 4, cy = y + CELL / 2 + d.y * 4;
        for (var k = -1; k <= 1; k += 2) {
          var ex = cx + px * 5 * k, ey = cy + py * 5 * k;
          ctx.fillStyle = '#f7f3d8';
          ctx.beginPath();
          ctx.arc(ex, ey, 3.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0d1a08';
          ctx.beginPath();
          ctx.arc(ex + d.x * 1.3, ey + d.y * 1.3, 1.9, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(ex + d.x * 1.3 - 0.7, ey + d.y * 1.3 - 0.7, 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawFood(now) {
        if (!state.food) return;
        var cx = state.food.x * CELL + CELL / 2;
        var cy = state.food.y * CELL + CELL / 2;
        var pulse = 1 + 0.06 * Math.sin(now / 250);
        var r = (CELL / 2 - 1.5) * pulse;

        ctx.fillStyle = 'rgba(0, 18, 4, 0.45)';
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy + r - 1, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();

        var g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
        g.addColorStop(0, '#ff9a7a');
        g.addColorStop(0.45, '#ef4444');
        g.addColorStop(1, '#8f1414');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        ctx.ellipse(cx - r * 0.38, cy - r * 0.42, r * 0.28, r * 0.16, -0.6, 0, Math.PI * 2);
        ctx.fill();

        // listek
        ctx.fillStyle = '#5fbf3a';
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy - r - 1, 5, 2.4, -0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawOverlay(lines) {
        ctx.fillStyle = 'rgba(6, 24, 10, 0.72)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 8;
        var mid = H / 2 - (lines.length - 1) * 18;
        for (var i = 0; i < lines.length; i++) {
          ctx.font = i === 0 ? '600 26px system-ui, sans-serif' : '18px system-ui, sans-serif';
          ctx.fillText(lines[i], W / 2, mid + i * 36);
        }
        ctx.shadowBlur = 0;
      }

      function render(now) {
        ctx.drawImage(boardImg, 0, 0, W, H);
        drawFood(now);
        drawSnake();

        scoreEl.textContent = 'Punkty: ' + state.score;

        if (state.status === 'ready') {
          drawOverlay(['Strzałki lub WSAD — start']);
        } else if (state.status === 'over') {
          drawOverlay(['Koniec gry · Punkty: ' + state.score, 'Spacja — nowa gra']);
        } else if (state.status === 'won') {
          drawOverlay(['Wygrana! Plansza zapełniona', 'Spacja — nowa gra']);
        }
      }

      function frame(now) {
        if (lastTime === null) lastTime = now;
        var dt = now - lastTime;
        lastTime = now;

        if (state.status === 'running') {
          // Górny limit akumulatora chroni przed lawiną kroków po powrocie z nieaktywnej karty.
          accumulator = Math.min(accumulator + dt, state.intervalMs * MAX_STEPS_PER_FRAME);
          var steps = 0;
          while (accumulator >= state.intervalMs && state.status === 'running' && steps < MAX_STEPS_PER_FRAME) {
            accumulator -= state.intervalMs;
            L.step(state);
            steps++;
          }
        } else {
          accumulator = 0;
        }

        render(now);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
